# CÁCH B — Agent Kibble chạy online trên GitHub Actions (miễn phí với repo public, không cần bật máy).
# Cần 3 secret trong repo của bạn (Settings → Secrets and variables → Actions):
#   OPENAI_API_KEY · TELEGRAM_BOT_TOKEN · DID_KEY (nội dung file secrets/<tên>.pkcs8.der.base64)
name: Agent Kibble (online)

on:
  schedule:
    - cron: "*/30 * * * *" # khoảng 30 phút 1 lần (GitHub hay trễ vài phút tới vài chục phút)
  workflow_dispatch: {} # nút "Run workflow" để chạy tay

permissions:
  contents: write # để lưu bộ nhớ agent (agent/data/) lại vào repo

concurrency:
  group: agent-online
  cancel-in-progress: false

jobs:
  run:
    # Không chạy ở repo hướng dẫn gốc (không có secret) — chỉ chạy ở repo của bạn.
    if: github.repository != 'KattyFury/guide_floplabs_build-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chạy agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DID_KEY: ${{ secrets.DID_KEY }}
        run: node agent/chay-online.js
      - name: Lưu bộ nhớ agent
        if: always()
        run: |
          git config user.name "kibble-agent"
          git config user.email "kibble-agent@users.noreply.github.com"
          git add -f agent/data/memory.json agent/data/bot.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "agent memory [skip ci]"
          git pull --rebase -q || true
          git push -q || true
